spring.application.name=Joonggonara

# 마이바티스 모델 경로 설정
mybatis.type-aliases-package=com.project.Joonggonara.model.vo,com.project.Joonggonara.model.dto

# 파일 하나의 최대 업로드 크기
spring.servlet.multipart.max-file-size=10MB

# 요청 전체 최대 크기
spring.servlet.multipart.max-request-size=70MB

# devtools 자동 리스타트 활성화
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/jg?characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=qwer1234
